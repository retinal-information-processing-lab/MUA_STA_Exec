# Dedicated environment for MUA_STA (modern stack: Python 3.14, numpy 2, Qt 6).
#   conda env create -f environment.yml
#   conda activate mua_sta
#   python -m mua_sta
# The launchers (MUA_STA.sh / MUA_STA.bat / MUA_STA.desktop) create it on first use.
name: mua_sta
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.14
  - numpy>=2
  - scipy>=1.14
  - spikeinterface>=0.105      # MUA peak detection, filtering, common reference
  - pyqt6>=6.7
  - matplotlib>=3.9          # the results figure, drawn as the standard pipeline draws it
  - pytest
